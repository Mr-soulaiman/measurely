    <script>
      // Ensure window.fetch is writable and configurable to prevent errors when tooling/proxies rebind fetch
      (function() {
        try {
          var nativeFetch = window.fetch;
          if (typeof nativeFetch === 'function') {
            var _activeFetch = nativeFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() { return _activeFetch; },
              set: function(fn) { _activeFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
